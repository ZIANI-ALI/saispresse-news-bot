name: News bot

on:
  schedule:
    # Kol job kaydour ~55 min; concurrency kaykhalli job jdida f queue, donc tghtiya 24/24.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Ch7al d d9i9a ybqa ydour (0 = dowra we7da)"
        default: "5"

permissions:
  contents: read
  actions: write   # bach run y-lanci run jay (chaine 24/24)

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    # 24/24 ghir ila variable NEWS_BOT_ENABLED = true (Settings > Secrets and variables > Actions > Variables).
    # Kol run melli ysali kay-lanci run jay (cron d GitHub machi mdmoun); cron kayb9a ghir backup.
    if: github.event_name == 'workflow_dispatch' || vars.NEWS_BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # fribidi: Pillow kay7tajha bach ykteb l 3arbiya mrbouta f cover Instagram
      - run: dpkg -s libfribidi0 >/dev/null 2>&1 || (sudo apt-get update -q && sudo apt-get install -y -q libfribidi0)

      - name: Restore state (akhbar li tsiftu)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: news-bot-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-bot-state-

      - name: Run bot
        run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          RUN_MINUTES: ${{ inputs.minutes || vars.RUN_MINUTES || '55' }}
          POLL_SECONDS: ${{ vars.POLL_SECONDS || '60' }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '7' }}
          SERPER_CREDITS: ${{ vars.SERPER_CREDITS || '2500' }}
          HIGH_SCORE: ${{ vars.HIGH_SCORE || '8' }}

      - name: Save state
        if: always() && hashFiles('state/seen.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state
          key: news-bot-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Lanci run jay (24/24)
        if: ${{ !cancelled() && vars.NEWS_BOT_ENABLED == 'true' }}
        run: gh workflow run news-bot.yml --repo "$GITHUB_REPOSITORY" --ref main -f minutes=55
        env:
          GH_TOKEN: ${{ github.token }}
